<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aress Family — Результаты</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 20%, #242424 0%, #0d0d0d 45%, #050505 100%);
            color: #eeeeee;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.16;
            background:
                repeating-linear-gradient(
                    135deg,
                    transparent 0px,
                    transparent 40px,
                    #ffffff 41px,
                    transparent 42px
                );
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #292929;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .logo span {
            color: #777777;
            font-size: 11px;
            display: block;
            letter-spacing: 5px;
            margin-top: 3px;
        }

        .back {
            color: #777777;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        .back:hover {
            color: #eeeeee;
        }

        main {
            min-height: calc(100vh - 80px);
            padding: 70px 20px 100px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .small-title {
            color: #777777;
            font-size: 12px;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            text-align: center;
            font-size: clamp(45px, 9vw, 90px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -4px;
            text-transform: uppercase;
        }

        h1 span {
            color: #8b8b8b;
        }

        .description {
            max-width: 600px;
            margin: 30px auto 60px;
            color: #888888;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .section-title {
            font-size: 13px;
            letter-spacing: 4px;
            color: #777777;
            margin-bottom: 15px;
        }

        .leaderboard {
            border: 1px solid #292929;
            background: rgba(12, 12, 12, 0.8);
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 80px 1fr 120px;
            padding: 18px 25px;
            border-bottom: 1px solid #292929;
            color: #555555;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .player {
            display: grid;
            grid-template-columns: 80px 1fr 120px;
            align-items: center;
            min-height: 75px;
            padding: 12px 25px;
            border-bottom: 1px solid #1f1f1f;
            transition: 0.2s;
        }

        .player:last-child {
            border-bottom: none;
        }

        .player:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .place {
            font-size: 22px;
            font-weight: 900;
            color: #777777;
        }

        .player:nth-child(2) .place {
            color: #eeeeee;
        }

        .player:nth-child(3) .place {
            color: #aaaaaa;
        }

        .player:nth-child(4) .place {
            color: #888888;
        }

        .username {
            font-size: 15px;
            font-weight: 700;
        }

        .score {
            text-align: right;
            font-size: 17px;
            font-weight: 900;
        }

        .score span {
            display: block;
            color: #555555;
            font-size: 9px;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        .status {
            text-align: center;
            padding: 35px 20px;
            color: #666666;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .error {
            color: #888888;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #444444;
            font-size: 9px;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 25px;
            }

            .back {
                font-size: 9px;
            }

            .leaderboard-header,
            .player {
                grid-template-columns: 55px 1fr 80px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .place {
                font-size: 18px;
            }

            .username {
                font-size: 13px;
            }

            .score {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        ARESS
        <span>FAMILY</span>
    </div>

    <a class="back" href="index.html">
        ← НАЗАД
    </a>
</header>

<main>
    <div class="container">

        <div class="small-title">
            ARESS FAMILY / RESULTS
        </div>

        <h1>
            Результат
            <span>Топы</span>
        </h1>

        <p class="description">
            Здесь отображаются результаты участников,
            завершивших тестирование.
        </p>

        <div class="section-title">
            ТОП УЧАСТНИКОВ
        </div>

        <div class="leaderboard">

            <div class="leaderboard-header">
                <div>МЕСТО</div>
                <div>DISCORD</div>
                <div>БАЛЛЫ</div>
            </div>

            <div id="leaderboard">
                <div class="status">
                    ЗАГРУЗКА РЕЗУЛЬТАТОВ...
                </div>
            </div>

        </div>

    </div>
</main>

<footer>
    © 2026 ARESS FAMILY — ADMINISTRATION SYSTEM
</footer>

<script>

const WORKER_URL =
    "https://aress-applications.adrianceban751.workers.dev";

async function loadLeaderboard() {

    const container = document.getElementById("leaderboard");

    try {

        const response = await fetch(
            WORKER_URL + "?action=leaderboard"
        );

        if (!response.ok) {
            throw new Error("Ошибка сервера");
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("Не удалось получить результаты");
        }

        if (!data.leaderboard || data.leaderboard.length === 0) {

            container.innerHTML = `
                <div class="status">
                    ПОКА НЕТ ЗАВЕРШЁННЫХ ТЕСТОВ
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        const hiddenPlayers = [
            "пвапва",
            "не указан",
            "hfgh"
        ];

        const players = data.leaderboard.map(player => {

            const name = (player.discordUser || "")
                .trim()
                .toLowerCase();

            if (
                name.startsWith("mirv") ||
                hiddenPlayers.includes(name)
            ) {
                return {
                    ...player,
                    score: 0
                };
            }

            return {
                ...player,
                score: Number(player.score) || 0
            };

        });

        players.sort((a, b) => {
            return Number(b.score) - Number(a.score);
        });

        players.forEach((player, index) => {

            const placeNumber = index + 1;

            let place = placeNumber;

            if (placeNumber === 1) {
                place = "🥇";
            } else if (placeNumber === 2) {
                place = "🥈";
            } else if (placeNumber === 3) {
                place = "🥉";
            }

            const row = document.createElement("div");

            row.className = "player";

            row.innerHTML = `
                <div class="place">${place}</div>

                <div class="username">
                    ${escapeHtml(player.discordUser)}
                </div>

                <div class="score">
                    ${player.score}
                    <span>БАЛЛОВ</span>
                </div>
            `;

            container.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="status error">
                НЕ УДАЛОСЬ ЗАГРУЗИТЬ РЕЗУЛЬТАТЫ
            </div>
        `;

    }
}

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text ?? "";

    return div.innerHTML;
}

loadLeaderboard();

</script>

</body>
</html>
