<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aress Family — Заявка</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 40%, #242424 0%, #0d0d0d 42%, #050505 100%);
            color: #eeeeee;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .box {
            width: 100%;
            max-width: 700px;
            border: 1px solid #292929;
            background: rgba(10, 10, 10, 0.9);
            padding: 50px;
        }

        .label {
            color: #666666;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .line {
            width: 60px;
            height: 2px;
            background: #eeeeee;
            margin: 25px 0;
        }

        p {
            color: #888888;
            line-height: 1.7;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 35px;
            color: #777777;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .back:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .box {
                padding: 30px;
            }

            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="label">ARESS FAMILY / ADMINISTRATION</div>

        <h1>Заявка</h1>

        <div class="line"></div>

        <p>
            Здесь будет находиться форма вступления
            в администрацию Aress Family.
        </p>

        <a class="back" href="index.html">
            ← НАЗАД
        </a>
    </div>

</body>
</html>
